name: aur

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and runs libfprint's test suite with the patch applied, so a patch
  # that no longer applies or breaks another driver never reaches the AUR.
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag that doesn't match the PKGBUILD would publish a version nobody
      # tagged, so stop before building anything.
      - name: check tag matches PKGBUILD
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source PKGBUILD
          if [ "${GITHUB_REF_NAME#v}" != "$pkgver-$pkgrel" ]; then
            echo "tag $GITHUB_REF_NAME does not match PKGBUILD version $pkgver-$pkgrel"
            exit 1
          fi

      # makepkg refuses to run as root
      - name: build and test
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder gpg --keyserver hkps://keyserver.ubuntu.com \
            --recv-keys D4C501DA48EB797A081750939449C2F50996635F
          sudo -u builder makepkg -s --noconfirm

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Job-level `if:` can't read the secrets context, so check for AUR_KEY
      # here and skip the deploy step until the secret exists.
      - id: check-secret
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      # Regenerates .SRCINFO in its own container and pushes PKGBUILD + patch.
      - if: steps.check-secret.outputs.has_key == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: libfprint-elan-0c28
          pkgbuild: ./PKGBUILD
          assets: ./elan-0c28-press-sigfm.patch
          updpkgsums: false
          commit_username: Lucas Santos
          commit_email: hello@lsantos.dev
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
